name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  credential-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux credential-store prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Run macOS or Windows credential contract
        if: runner.os != 'Linux'
        run: cargo test -p signal-core --test system_credential_contract -- --ignored
      - name: Run Linux credential contract in an isolated Secret Service session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            printf "\n" | gnome-keyring-daemon --unlock >/dev/null
            cargo test -p signal-core --test system_credential_contract -- --ignored
          '

  macos-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Generate Swift bindings
        run: scripts/generate-swift-bindings.sh
      - name: Build the real CLI for shared-process bridge tests
        run: cargo build -p signal-cli
      - name: Run bridge contracts
        run: cargo test -p signal-ffi --all-features
      - name: Run Swift tests
        run: swift test --package-path apps/macos
      - name: Build release Swift executable
        run: swift build --package-path apps/macos -c release
      - name: Assemble and verify standalone app bundle
        run: |
          scripts/build-macos-app.sh
          scripts/verify-macos-app.sh

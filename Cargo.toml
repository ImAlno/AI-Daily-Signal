[workspace]
members = ["crates/signal-core", "crates/signal-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
atomic-write-file = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
fastrand = "2"
feed-rs = { version = "2.4", features = ["sanitize"] }
html-escape = "0.2"
keyring = "4.1.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
wiremock = "0.6.5"
